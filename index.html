<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3f6f">
<title>臺北市立聯合醫院仁愛院區｜多語用藥資訊工具</title>
<style>
:root{--bg:#f4f7fa;--ink:#172033;--muted:#64748b;--primary:#0b3f6f;--primary2:#155c93;--line:#dbe3ec;--soft:#edf4fa;--danger:#b42318;--ok:#0f766e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom))}
.brand{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 10px 24px rgba(11,63,111,.16)}
.hospital{font-size:12px;font-weight:750;opacity:.9;line-height:1.45}
.brand h1{margin:7px 0 4px;font-size:27px;line-height:1.22}
.brand p{margin:0;opacity:.92;line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.title{font-size:19px;font-weight:850;margin-bottom:10px}
select{width:100%;padding:14px;border:1px solid #b9c5d3;border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.btn{width:100%;border:0;border-radius:12px;padding:16px;margin-top:12px;font-size:18px;font-weight:850;background:var(--primary);color:#fff;cursor:pointer}
.btn.secondary{background:var(--soft);color:var(--primary)}
.hint{font-size:14px;color:var(--muted);line-height:1.65;margin-top:10px}
.guide{background:#f8fbfe;border:1px solid var(--line);border-radius:14px;padding:10px;margin:12px 0}
.guideImg{display:block;width:100%;height:auto;object-fit:contain;border-radius:10px;border:1px solid #cbd8e4;background:#fff}
.guideText{display:grid;gap:4px;margin-top:9px;font-size:14px;line-height:1.5}
.good{color:#0f766e;font-weight:850} .bad{color:#b42318;font-weight:850}
.readerStage{position:relative;width:100%;margin-top:14px;border-radius:16px;overflow:hidden;background:#0f172a}
#reader{width:100%}
#reader video{width:100%!important;height:auto!important;display:block!important;object-fit:cover!important}
.scanOverlay{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:20}
.readerStage.active .scanOverlay{display:grid}
.scanFrame{width:72%;max-width:340px;aspect-ratio:1;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);position:relative}
.scanPrompt{position:absolute;top:16px;left:16px;right:16px;text-align:center;color:#fff;font-weight:850;font-size:14px;text-shadow:0 1px 3px #000}
.status{padding:12px;border-radius:12px;margin-top:10px;font-size:14px;line-height:1.5}
.status.info{background:#eaf4ff;color:#174a74} .status.error{background:#fff0ee;color:var(--danger)} .status.ok{background:#ecfdf5;color:var(--ok)}
.notice{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;padding:12px 8px}
.hidden{display:none!important}
@media(max-width:520px){.wrap{padding-left:16px;padding-right:16px}.card{padding:18px}.brand h1{font-size:25px}.scanFrame{width:72%;max-width:320px}}
</style>
</head>

const GROUP={"zh-TW": ["常用語言", "更多語言"], "en": ["Common languages", "More languages"], "ja": ["よく使う言語", "その他の言語"], "ko": ["자주 사용하는 언어", "더 많은 언어"], "vi": ["Ngôn ngữ thường dùng", "Ngôn ngữ khác"], "th": ["ภาษาที่ใช้บ่อย", "ภาษาเพิ่มเติม"], "id": ["Bahasa umum", "Bahasa lainnya"], "tl": ["Mga karaniwang wika", "Higit pang mga wika"], "ms": ["Bahasa lazim", "Lebih banyak bahasa"], "my": ["အသုံးများသော ဘာသာစကားများ", "နောက်ထပ် ဘာသာစကားများ"], "km": ["ភាសាដែលប្រើញឹកញាប់", "ភាសាបន្ថែម"], "hi": ["सामान्य भाषाएँ", "अन्य भाषाएँ"], "bn": ["সাধারণ ভাষা", "আরও ভাষা"], "ne": ["सामान्य भाषाहरू", "थप भाषाहरू"], "ar": ["اللغات الشائعة", "مزيد من اللغات"], "es": ["Idiomas comunes", "Más idiomas"], "fr": ["Langues courantes", "Plus de langues"], "de": ["Häufige Sprachen", "Weitere Sprachen"], "pt": ["Idiomas comuns", "Mais idiomas"], "ru": ["Популярные языки", "Другие языки"]};
let scanner=null,starting=false,detected=false;
const langEl=document.getElementById('lang');
const startBtnEl=document.getElementById('startBtn');
const stopBtnEl=document.getElementById('stopBtn');
const statusEl=document.getElementById('status');
const readerStage=document.getElementById('readerStage');
const guideBlock=document.getElementById('guideBlock');

function ui(){return UI[langEl.value]||UI.en}
function detectLanguage(){
  const raw=(navigator.language||'en').toLowerCase();
  if(raw.startsWith('zh'))return'zh-TW';
  for(const c of ['ja','ko','vi','th','id','ms','my','km','hi','bn','ne','ar','es','fr','de','pt','ru']) if(raw.startsWith(c)) return c;
  if(raw.startsWith('fil')||raw.startsWith('tl'))return'tl';
  return'en';
}
function applyUi(){
  const x=ui(),g=GROUP[langEl.value]||GROUP.en;
  document.getElementById('title').textContent=x.title;
  document.getElementById('subtitle').textContent=x.subtitle;
  document.getElementById('langTitle').textContent=x.lang;
  document.getElementById('scanTitle').textContent=x.scan;
  document.getElementById('scanHint').textContent=x.hint;
  document.getElementById('goodText').textContent=x.good;
  document.getElementById('badText').textContent=x.bad;
  document.getElementById('scanPrompt').textContent=x.prompt;
  startBtnEl.textContent=x.start;
  stopBtnEl.textContent=x.stop;
  document.getElementById('notice').textContent=x.notice;
  document.getElementById('commonGroup').label=g[0];
  document.getElementById('moreGroup').label=g[1];
  document.documentElement.dir=langEl.value==='ar'?'rtl':'ltr';
}
function setStatus(msg,type='info'){
  statusEl.textContent=msg; statusEl.className='status '+type; statusEl.classList.remove('hidden');
}
function extractCode(text){
  const s=String(text||'').trim();
  if(/^[A-Za-z0-9_.-]{1,40}$/.test(s))return s;
  if(!/^https:\/\/websrv01\.tpech\.gov\.tw\/ESMC\/Home\/Detail\?/i.test(s))return'';
  const m=s.match(/[?&]odr_code=([^&#]+)/i);
  if(!m||!m[1])return'';
  try{return decodeURIComponent(m[1]).trim()}catch(e){return m[1].trim()}
}
async function startScanner(){
  if (starting) return;

  // A manual Stop must allow a fresh scan session.
  detected = false;

  // Clean up any stale scanner instance / DOM left by iPhone Safari.
  try{
    if(scanner){
      if(scanner.isScanning) await scanner.stop();
      await scanner.clear();
    }
  }catch(e){}
  scanner = null;

  const readerEl = document.getElementById('reader');
  if(readerEl) readerEl.innerHTML = '';

  starting = true;
  setStatus(ui().opening,'info');

  try{
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      { facingMode:'environment' },
      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight){
          const min = Math.min(viewfinderWidth, viewfinderHeight);
          const size = Math.floor(min * 0.72);
          return { width:size, height:size };
        },
        aspectRatio: 1.0
      },
      async decodedText => {
        if (detected) return;

        const code = extractCode(decodedText);
        if (!code) {
          setStatus(ui().invalid,'error');
          return;
        }

        detected = true;
        setStatus(ui().found,'ok');

        try { await stopScanner(false); } catch(e){}

        const url = APP_URL +
          (APP_URL.includes('?') ? '&' : '?') +
          'odr_code=' + encodeURIComponent(code) +
          '&lang=' + encodeURIComponent(langEl.value) +
          '&return_url=' + encodeURIComponent(window.location.href.split('#')[0]);

        window.location.href = url;
      },
      () => {}
    );

    guideBlock.classList.add('hidden');
    readerStage.classList.add('active');
    startBtnEl.classList.add('hidden');
    stopBtnEl.classList.remove('hidden');
    setStatus(ui().ready,'info');

    // Immediate positioning only; no smooth animation while camera is starting.
    setTimeout(()=>readerStage.scrollIntoView({behavior:'auto',block:'center'}),80);
  }catch(err){
    setStatus(ui().camera,'error');
    scanner = null;
    readerStage.classList.remove('active');
    guideBlock.classList.remove('hidden');
    startBtnEl.classList.remove('hidden');
    stopBtnEl.classList.add('hidden');
  }finally{
    starting = false;
  }
}

async function stopScanner(showStart=true){
  try{
    if(scanner&&scanner.isScanning) await scanner.stop();
    if(scanner) await scanner.clear();
  }catch(e){}

  scanner=null;
  starting=false;
  detected=false;

  const readerEl=document.getElementById('reader');
  if(readerEl) readerEl.innerHTML='';

  readerStage.classList.remove('active');
  guideBlock.classList.remove('hidden');

  if(showStart){
    startBtnEl.classList.remove('hidden');
    stopBtnEl.classList.add('hidden');
    statusEl.classList.add('hidden');
  }
}

langEl.value=localStorage.getItem('drugToolLang')||detectLanguage();
if(![...langEl.options].some(o=>o.value===langEl.value))langEl.value='en';
applyUi();
langEl.addEventListener('change',()=>{localStorage.setItem('drugToolLang',langEl.value);applyUi()});
</script>
